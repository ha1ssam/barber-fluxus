# Sobe tudo: banco, app, worker (lembretes e fila de WhatsApp) e gateway do WhatsApp por QR Code.
# Uso: cp .env.example .env  (preencha os segredos)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxus}
      POSTGRES_DB: fluxus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluxus']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fluxus:${POSTGRES_PASSWORD:-fluxus}@db:5432/fluxus
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:4010
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_INTERNAL_URL: http://app:3000
    command: ['node', 'scripts/worker.mjs']
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  whatsapp-gateway:
    build: services/whatsapp-gateway
    env_file: .env
    environment:
      APP_INTERNAL_URL: http://app:3000
    volumes:
      - wa-sessions:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  wa-sessions:
