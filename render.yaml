# Deploy de teste no Render (plano grátis): app + Postgres.
# No Render: New > Blueprint > escolha este repositório. A loja de exemplo é criada sozinha (SEED_DEMO=1).
services:
  - type: web
    name: fluxus
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fluxus-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Sem worker separado no plano grátis: o próprio app roda o agendador.
      - key: INTERNAL_CRON
        value: '1'
      - key: SEED_DEMO
        value: '1'

databases:
  - name: fluxus-db
    plan: free
    region: virginia
    databaseName: fluxus
    user: fluxus
